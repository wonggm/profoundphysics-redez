<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Profound Physics">
  <title>Profound Physics</title>
  <!-- Stylized Greek phi (φ) — the symbol of physics, angular momentum, the golden ratio.
       The vertical bar pierces an elegant circle, suggesting depth and a "looking through"
       to the foundations of physical law. -->
  <g fill="currentColor">
    <!-- Vertical stroke of phi -->
    <rect x="14.5" y="2" width="3" height="28" rx="0.5"/>
    <!-- Circle of phi — a ring with a small gap on the right where the bar crosses -->
    <path d="
      M 16 6
      A 8 8 0 1 0 16 26
      A 8 8 0 1 0 16 6
      Z
      M 16 9
      A 5 5 0 1 1 16 23
      A 5 5 0 1 1 16 9
      Z
    " fill-rule="evenodd"/>
  </g>
</svg>
