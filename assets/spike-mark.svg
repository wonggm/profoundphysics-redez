<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Profound Physics">
  <title>Profound Physics spike mark</title>
  <!-- 4-spoke radial asterisk. Each spoke is a thin tapered diamond. -->
  <g fill="currentColor">
    <!-- top spoke -->
    <path d="M16 2 L18 14 L16 16 L14 14 Z"/>
    <!-- right spoke -->
    <path d="M30 16 L18 18 L16 16 L18 14 Z"/>
    <!-- bottom spoke -->
    <path d="M16 30 L14 18 L16 16 L18 18 Z"/>
    <!-- left spoke -->
    <path d="M2 16 L14 14 L16 16 L14 18 Z"/>
  </g>
</svg>
